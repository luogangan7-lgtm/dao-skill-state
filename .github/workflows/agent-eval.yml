name: agent-eval
# Evaluations B/C/D (charter 2026-10-14): Claude Code headless on frozen public tasks, with and
# without skills, checked by each task's deterministic checker. The model runs on one of the owner's
# subscriptions through its Anthropic-compatible endpoint: Kimi For Coding (secret KIMI_API),
# MiniMax (secret MINIMAX_API, China endpoint), DeepSeek (secret DEEPSEEK_API), or NVIDIA's free
# hosted models (secret NVIDIA_API; OpenAI-format only, so through a pinned local adapter). Model jobs run on manual dispatch only, so pull
# requests never spend a subscription window.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: comma-separated task names (empty = all)
        default: ""
      arms:
        default: none,skills
      reps:
        default: "1"
      provider:
        description: "kimi (KIMI_API, Kimi For Coding), minimax (MINIMAX_API, MiniMax coding plan), deepseek (DEEPSEEK_API) or nvidia (NVIDIA_API, free hosted)"
        default: kimi
      model:
        description: "empty = the provider's default (kimi: k3, minimax: MiniMax-M3, deepseek: deepseek-flash, nvidia: nvidia/nemotron-3-super-120b-a12b)"
        default: ""
      suite:
        description: "run = skill effect (evals/agent/tasks); create = skill creation (create-tasks); evolve = skill evolution (evolve-tasks); resume = fixed steps vs stateful skill on an interrupted task (resume-tasks)"
        default: run
  pull_request:
    paths:
      - evals/agent/**
      - .github/workflows/agent-eval.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checkers:
    # every task has a prompt and a checker that fails on an empty workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 python-docx==1.1.2 pypdf==5.1.0 python-pptx==1.0.2 reportlab==4.2.5 pytest==8.3.4 pyyaml==6.0.2
      - run: |
          for t in evals/agent/tasks/*/ evals/agent/create-tasks/*/usage/*/ evals/agent/evolve-tasks/*/usage/*/ evals/agent/resume-tasks/*/; do
            test -f "$t/prompt.md" || test -f "$t/first.md"
            test -f "$t/check.py"
            # an empty workspace must fail cleanly (exit 1), not pass and not crash
            rc=0; python3 "$t/check.py" "$(mktemp -d)" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 1 ] || { echo "$t: checker exit $rc on an empty workspace (want 1)"; exit 1; }
          done
  run:
    if: github.event_name == 'workflow_dispatch'
    needs: checkers
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      # one model job at a time per subscription (each has a usage window); providers run in parallel
      group: agent-eval-${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code (pinned) and task tooling
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.285 docx@9.8.1 pptxgenjs@4.0.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"  # so require('docx') finds the global install
          # LibreOffice: the office skills convert and recalculate with it; both arms get it
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress > /dev/null
          # the same libraries are available to the agent in both arms; checkers use them too
          pip install openpyxl==3.1.5 python-docx==1.1.2 pypdf==5.1.0 python-pptx==1.0.2 reportlab==4.2.5 pytest==8.3.4 pyyaml==6.0.2
      - name: Build skill-hub (for the hook arm)
        run: |
          (cd crates/skill-hub && cargo build --release --locked)
          echo "SKILL_HUB_BIN=$PWD/crates/skill-hub/target/release/skill-hub" >> "$GITHUB_ENV"
      - name: Fetch third-party skills at pinned commits (never committed)
        run: |
          mkdir -p "$RUNNER_TEMP/sources"
          jq -r '.sources[] | "\(.repo) \(.rev)"' crates/dao/tools/intake_bench.json | while read -r repo rev; do
            d="$RUNNER_TEMP/sources/${repo//\//_}"
            git init -q "$d"
            git -C "$d" fetch -q --depth 1 "https://github.com/$repo" "$rev"
            git -C "$d" checkout -q FETCH_HEAD
            # skills are data for the agent: no hooks from them
            rm -rf "$d/.git"
          done
          echo "SKILL_SOURCES=$RUNNER_TEMP/sources" >> "$GITHUB_ENV"
      - name: Install the NVIDIA adapter (no secrets in this step)
        if: inputs.provider == 'nvidia'
        run: |
          # every package pinned with its sha512 by the committed lockfile; no install scripts run
          mkdir -p "$RUNNER_TEMP/ccr"; cp evals/agent/nvidia-adapter/package*.json "$RUNNER_TEMP/ccr/"; cd "$RUNNER_TEMP/ccr"
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3  # the one native dependency; its prebuilt binary, still with no secret here
          gw="$RUNNER_TEMP/ccr/node_modules/@musistudio/claude-code-router/dist/main/next-ai-gateway.js"
          echo "57c7cb2113d22ea495b2162dcd5306b1c938cde0de1c1312e79dea8bc4e261b0  $gw" | sha256sum --check
      - name: Start the NVIDIA adapter (Anthropic Messages -> OpenAI chat)
        if: inputs.provider == 'nvidia'
        env:
          NVIDIA_API: ${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API || '' }}
          IN_MODEL: ${{ inputs.model || 'nvidia/nemotron-3-super-120b-a12b' }}
        run: |
          [ -n "$NVIDIA_API" ] || { echo "no key for provider nvidia"; exit 1; }
          # free hosted models that call tools; request overrides per NVIDIA's model reference
          case "$IN_MODEL" in
            nvidia/nemotron-3-super-120b-a12b) body='{"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":false}}' ;;
            nvidia/nemotron-3.5-super-vl-120b-a12b) body='{"reasoning_effort":"high"}' ;;
            nvidia/nemotron-3.5-lightning-30b-a3b) body='{"chat_template_kwargs":{"enable_thinking":false}}' ;;
            *) echo "model not in the tested NVIDIA list"; exit 1 ;;
          esac
          gw="$RUNNER_TEMP/ccr/node_modules/@musistudio/claude-code-router/dist/main/next-ai-gateway.js"
          umask 077
          home="$RUNNER_TEMP/ccr-home"; mkdir -p "$home/.claude-code-router"
          token=$(openssl rand -hex 32); echo "::add-mask::$token"
          jq -n --arg model "$IN_MODEL" --arg token "$token" --argjson body "$body" '{APIKEY:$token,HOST:"127.0.0.1",PORT:3456,API_TIMEOUT_MS:180000,gateway:{enabled:true,host:"127.0.0.1",port:3456,coreHost:"127.0.0.1",corePort:3457},preferredProvider:"nvidia",Providers:[{name:"nvidia",api_base_url:"https://integrate.api.nvidia.com/v1",api_key:env.NVIDIA_API,models:[$model],protocolDetectionMode:"manual",capabilities:[{type:"openai_chat_completions",baseUrl:"https://integrate.api.nvidia.com/v1"}],account:{enabled:false},autoFetchModels:false,autoFetchKnownModels:false,extraBody:($body+{max_tokens:32000})}],Router:{builtInRules:{"claude-code":{enabled:false},codex:{enabled:false}},fallback:{mode:"off",models:[],retryCount:0},rules:[]},plugins:[],profile:{enabled:false,profiles:[],claudeCode:{enabled:false},codex:{enabled:false}},observability:{agentAnalysis:false,requestLogs:false,requestLogBodyCapture:"none",requestLogMaxBodyBytes:0}}' > "$home/.claude-code-router/config.json"
          env -u NVIDIA_API CCR_INTERNAL_HOME_DIR="$home" CCR_GATEWAY_ENTRY="$gw" CCR_RAW_TRACE_ENABLED=0 \
            CCR_MODEL_CATALOG_PATH="$RUNNER_TEMP/ccr/node_modules/@musistudio/claude-code-router/dist/models.json" \
            CCR_WEB_AUTH_TOKEN="$(openssl rand -hex 32)" UPSTREAM_TIMEOUT_MS=180000 \
            nohup "$RUNNER_TEMP/ccr/node_modules/.bin/ccr" serve --no-open --host 127.0.0.1 --port 3458 > "$RUNNER_TEMP/ccr.log" 2>&1 &
          for i in $(seq 1 45); do
            curl -sf --max-time 2 http://127.0.0.1:3456/health >/dev/null && break
            sleep 1
          done
          curl -sf --max-time 2 http://127.0.0.1:3456/health >/dev/null || { echo "adapter did not start"; tail -c 3000 "$RUNNER_TEMP/ccr.log"; exit 1; }
          # the agent is given only the local adapter and a throwaway token, but it runs as the same
          # user and could read the key from the adapter config, as it can read its own key with the
          # other providers; use a free-tier key only
          { echo "NV_ADAPTER_TOKEN=$token"; echo "NV_MODEL=nvidia/$IN_MODEL"; } >> "$GITHUB_ENV"
      - name: Run tasks
        env:
          # Anthropic-compatible endpoints of the owner's subscriptions; only the chosen one's key is set
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'minimax' && 'https://api.minimaxi.com/anthropic' || inputs.provider == 'deepseek' && 'https://api.deepseek.com/anthropic' || inputs.provider == 'nvidia' && 'http://127.0.0.1:3456' || 'https://api.kimi.com/coding/' }}
          # each key is set only for its own provider (an `a && b || c` fallback could send one
          # provider's key to the other's endpoint if a secret were missing)
          KEY_KIMI: ${{ inputs.provider == 'kimi' && secrets.KIMI_API || '' }}
          KEY_MINIMAX: ${{ inputs.provider == 'minimax' && secrets.MINIMAX_API || '' }}
          KEY_DEEPSEEK: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API || '' }}
          ANTHROPIC_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          # inputs reach the shell as data, never as interpolated script
          IN_TASKS: ${{ inputs.tasks }}
          IN_ARMS: ${{ inputs.arms }}
          IN_REPS: ${{ inputs.reps }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$IN_PROVIDER" in kimi|minimax|deepseek|nvidia) ;; *) echo "unknown provider"; exit 1 ;; esac
          export ANTHROPIC_AUTH_TOKEN="${KEY_KIMI}${KEY_MINIMAX}${KEY_DEEPSEEK}${NV_ADAPTER_TOKEN:-}"
          if [ "$IN_PROVIDER" = nvidia ]; then
            export ANTHROPIC_MODEL="$NV_MODEL" ANTHROPIC_DEFAULT_HAIKU_MODEL="$NV_MODEL" CLAUDE_CODE_MAX_OUTPUT_TOKENS=32000
          fi
          unset KEY_KIMI KEY_MINIMAX KEY_DEEPSEEK
          [ -n "$ANTHROPIC_AUTH_TOKEN" ] || { echo "no key for provider $IN_PROVIDER"; exit 1; }
          if [ "$IN_SUITE" = resume ]; then
            pip install --quiet ./evals/agent/warehouse  # the stand-in external system (backfill-external, backfill-crash*)
            python3 evals/agent/resume.py evals/agent/resume-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          elif [ "$IN_SUITE" = evolve ]; then
            python3 evals/agent/evolve.py evals/agent/evolve-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          elif [ "$IN_SUITE" = create ]; then
            python3 evals/agent/create.py evals/agent/create-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          else
            python3 evals/agent/run.py evals/agent/tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          fi
          { echo "## agent-eval ($IN_PROVIDER: $ANTHROPIC_MODEL)"; echo; sed -n '/^| task/,$p' summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the NVIDIA key out of the artifact
        if: always() && inputs.provider == 'nvidia'
        env:
          NVIDIA_API: ${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API || '' }}
        run: |
          # backstop for the paths uploaded below: drops files holding the key verbatim (not encoded copies)
          [ -z "$NVIDIA_API" ] || [ ! -d results ] || { grep -rlZF -- "$NVIDIA_API" results || true; } | xargs -0 -r rm -vf --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: |
            results/*.jsonl
            results/candidates/
            results/created/
