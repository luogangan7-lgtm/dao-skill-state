name: agent-eval
# Evaluations B/C/D (charter 2026-10-14): Claude Code headless on frozen public tasks, with and
# without skills, checked by each task's deterministic checker. The model runs on one of the owner's
# subscriptions through its Anthropic-compatible endpoint: Kimi For Coding (secret KIMI_API),
# MiniMax (secret MINIMAX_API, China endpoint) or DeepSeek (secret DEEPSEEK_API). Model jobs run on manual dispatch only, so pull
# requests never spend a subscription window.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: comma-separated task names (empty = all)
        default: ""
      arms:
        default: none,skills
      reps:
        default: "1"
      provider:
        description: "kimi (KIMI_API, Kimi For Coding), minimax (MINIMAX_API, MiniMax coding plan) or deepseek (DEEPSEEK_API)"
        default: kimi
      model:
        description: "empty = the provider's default (kimi: k3, minimax: MiniMax-M3, deepseek: deepseek-flash)"
        default: ""
      suite:
        description: "run/create/evolve/resume = frozen legacy suites; resume-rust = Rust two-session boundary matrix (make:dao only)"
        default: run
  pull_request:
    paths:
      - evals/agent/**
      - .github/workflows/agent-eval.yml
      - crates/dao/**
      - dao-skill-state/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  rust-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify the Rust compiler
        id: rust
        run: echo "hash=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust checks
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            crates/dao/target/debug
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-dao-debug-${{ hashFiles('crates/dao/Cargo.lock') }}-${{ hashFiles('crates/dao/src/**', 'crates/dao/tests/**', 'crates/dao/Cargo.toml') }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-dao-debug-${{ hashFiles('crates/dao/Cargo.lock') }}-
      - name: Record cache receipt
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze the legacy Python baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-origin/main}"
          changed=$(git diff --name-only "$base" HEAD -- '*.py')
          [ -z "$changed" ] || { echo "Rust resume work must preserve Python baseline:"; echo "$changed"; exit 1; }
      - name: Rust formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --manifest-path crates/dao/Cargo.toml --check
      - name: Rust clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path crates/dao/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests and adversarial gate calibration
        id: tests
        continue-on-error: true
        run: cargo test --manifest-path crates/dao/Cargo.toml --locked
      - name: Export a CI formatting patch
        if: always() && steps.fmt.outcome == 'failure'
        run: |
          cargo fmt --manifest-path crates/dao/Cargo.toml
          git diff -- crates/dao > "$RUNNER_TEMP/resume-rust-format.patch"
      - uses: actions/upload-artifact@v4
        if: always() && steps.fmt.outcome == 'failure'
        with:
          name: resume-rust-format
          path: ${{ runner.temp }}/resume-rust-format.patch
      - name: Require every Rust check
        if: always()
        env:
          FMT_RESULT: ${{ steps.fmt.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: test "$FMT_RESULT/$CLIPPY_RESULT/$TEST_RESULT" = success/success/success
  checkers:
    # every task has a prompt and a checker that fails on an empty workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 python-docx==1.1.2 pypdf==5.1.0 python-pptx==1.0.2 reportlab==4.2.5 pytest==8.3.4 pyyaml==6.0.2
      - run: |
          for t in evals/agent/tasks/*/ evals/agent/create-tasks/*/usage/*/ evals/agent/evolve-tasks/*/usage/*/ evals/agent/resume-tasks/*/; do
            test -f "$t/prompt.md" || test -f "$t/first.md"
            test -f "$t/check.py"
            # an empty workspace must fail cleanly (exit 1), not pass and not crash
            rc=0; python3 "$t/check.py" "$(mktemp -d)" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 1 ] || { echo "$t: checker exit $rc on an empty workspace (want 1)"; exit 1; }
          done
  run:
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'resume-rust'
    needs: checkers
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      # one model job at a time per subscription (each has a usage window); providers run in parallel
      group: agent-eval-${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code (pinned) and task tooling
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.285 docx@9.8.1 pptxgenjs@4.0.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"  # so require('docx') finds the global install
          # LibreOffice: the office skills convert and recalculate with it; both arms get it
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress > /dev/null
          # the same libraries are available to the agent in both arms; checkers use them too
          pip install openpyxl==3.1.5 python-docx==1.1.2 pypdf==5.1.0 python-pptx==1.0.2 reportlab==4.2.5 pytest==8.3.4 pyyaml==6.0.2
      - name: Build skill-hub (for the hook arm)
        run: |
          (cd crates/skill-hub && cargo build --release --locked)
          echo "SKILL_HUB_BIN=$PWD/crates/skill-hub/target/release/skill-hub" >> "$GITHUB_ENV"
      - name: Fetch third-party skills at pinned commits (never committed)
        run: |
          mkdir -p "$RUNNER_TEMP/sources"
          jq -r '.sources[] | "\(.repo) \(.rev)"' crates/dao/tools/intake_bench.json | while read -r repo rev; do
            d="$RUNNER_TEMP/sources/${repo//\//_}"
            git init -q "$d"
            git -C "$d" fetch -q --depth 1 "https://github.com/$repo" "$rev"
            git -C "$d" checkout -q FETCH_HEAD
            # skills are data for the agent: no hooks from them
            rm -rf "$d/.git"
          done
          echo "SKILL_SOURCES=$RUNNER_TEMP/sources" >> "$GITHUB_ENV"
      - name: Run tasks
        env:
          # Anthropic-compatible endpoints of the owner's subscriptions; only the chosen one's key is set
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'minimax' && 'https://api.minimaxi.com/anthropic' || inputs.provider == 'deepseek' && 'https://api.deepseek.com/anthropic' || 'https://api.kimi.com/coding/' }}
          # each key is set only for its own provider (an `a && b || c` fallback could send one
          # provider's key to the other's endpoint if a secret were missing)
          KEY_KIMI: ${{ inputs.provider == 'kimi' && secrets.KIMI_API || '' }}
          KEY_MINIMAX: ${{ inputs.provider == 'minimax' && secrets.MINIMAX_API || '' }}
          KEY_DEEPSEEK: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API || '' }}
          ANTHROPIC_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          # inputs reach the shell as data, never as interpolated script
          IN_TASKS: ${{ inputs.tasks }}
          IN_ARMS: ${{ inputs.arms }}
          IN_REPS: ${{ inputs.reps }}
          IN_SUITE: ${{ inputs.suite }}
          IN_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$IN_PROVIDER" in kimi|minimax|deepseek) ;; *) echo "unknown provider"; exit 1 ;; esac
          export ANTHROPIC_AUTH_TOKEN="${KEY_KIMI}${KEY_MINIMAX}${KEY_DEEPSEEK}"
          unset KEY_KIMI KEY_MINIMAX KEY_DEEPSEEK
          [ -n "$ANTHROPIC_AUTH_TOKEN" ] || { echo "no key for provider $IN_PROVIDER"; exit 1; }
          if [ "$IN_SUITE" = resume ]; then
            pip install --quiet ./evals/agent/warehouse  # the stand-in external system (backfill-external, backfill-crash*)
            python3 evals/agent/resume.py evals/agent/resume-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          elif [ "$IN_SUITE" = evolve ]; then
            python3 evals/agent/evolve.py evals/agent/evolve-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          elif [ "$IN_SUITE" = create ]; then
            python3 evals/agent/create.py evals/agent/create-tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          else
            python3 evals/agent/run.py evals/agent/tasks results --tasks "$IN_TASKS" \
              --arms "$IN_ARMS" --reps "$IN_REPS" | tee summary.txt
          fi
          { echo "## agent-eval ($IN_PROVIDER: $ANTHROPIC_MODEL)"; echo; sed -n '/^| task/,$p' summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval
          path: |
            results/*.jsonl
            results/candidates/
            results/created/
  resume-rust-model:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'resume-rust'
    needs: rust-resume
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: agent-eval-${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify the Rust compiler
        id: rust
        run: echo "hash=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust release builds
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            crates/dao/target/release
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-dao-release-${{ hashFiles('crates/dao/Cargo.lock') }}-${{ hashFiles('crates/dao/src/**', 'crates/dao/Cargo.toml') }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-dao-release-${{ hashFiles('crates/dao/Cargo.lock') }}-
      - name: Record cache receipt
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned Claude CLI and build Rust DAO
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.285
          cargo -V
          cargo build --manifest-path crates/dao/Cargo.toml --release --locked
          echo "$PWD/crates/dao/target/release" >> "$GITHUB_PATH"
      - name: Save the compiled Rust build
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            crates/dao/target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Run the Rust boundary matrix
        env:
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'minimax' && 'https://api.minimaxi.com/anthropic' || inputs.provider == 'deepseek' && 'https://api.deepseek.com/anthropic' || 'https://api.kimi.com/coding/' }}
          KEY_KIMI: ${{ inputs.provider == 'kimi' && secrets.KIMI_API || '' }}
          KEY_MINIMAX: ${{ inputs.provider == 'minimax' && secrets.MINIMAX_API || '' }}
          KEY_DEEPSEEK: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API || '' }}
          ANTHROPIC_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.model || (inputs.provider == 'minimax' && 'MiniMax-M3' || inputs.provider == 'deepseek' && 'deepseek-flash' || 'k3') }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          IN_TASKS: ${{ inputs.tasks }}
          IN_ARMS: ${{ inputs.arms }}
          IN_REPS: ${{ inputs.reps }}
          IN_PROVIDER: ${{ inputs.provider }}
        run: |
          case "$IN_PROVIDER" in kimi|minimax|deepseek) ;; *) echo "unknown provider"; exit 1 ;; esac
          [ "$IN_ARMS" = make:dao ] || { echo "resume-rust requires make:dao"; exit 1; }
          export ANTHROPIC_AUTH_TOKEN="${KEY_KIMI}${KEY_MINIMAX}${KEY_DEEPSEEK}"
          unset KEY_KIMI KEY_MINIMAX KEY_DEEPSEEK
          [ -n "$ANTHROPIC_AUTH_TOKEN" ] || { echo "missing selected provider key"; exit 1; }
          args=(eval resume run --repo "$PWD" --out results --reps "$IN_REPS")
          if [ -n "$IN_TASKS" ]; then args+=(--tasks "$IN_TASKS"); fi
          dao "${args[@]}" | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-rust-eval
          include-hidden-files: true
          path: |
            results/
            summary.txt
