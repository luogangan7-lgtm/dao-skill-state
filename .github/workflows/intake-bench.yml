name: intake-bench
# Evaluation A1: the DAO supply chain on real public third-party skills (pinned commits in
# crates/dao/tools/intake_bench.json): intake -> scan -> normalize -> relations -> routing eval
# -> admission -> publish (dry run). Measures every stage; nothing is published or committed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/dao/**
      - crates/skill-hub/src/**
      - .github/workflows/intake-bench.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash  # -eo pipefail
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify the Rust compiler
        id: rust
        run: |
          dao_compiler=$(cd crates/dao && rustc -vV)
          hub_compiler=$(cd crates/skill-hub && rustc -vV)
          echo "hash=$(printf '%s\n%s\n' "$dao_compiler" "$hub_compiler" | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            crates/dao/target
            crates/skill-hub/target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-intake-release-${{ hashFiles('crates/*/Cargo.lock') }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml') }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-intake-release-${{ hashFiles('crates/*/Cargo.lock') }}-
      - name: Record cache receipt
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build dao and skill-hub
        run: |
          (cd crates/dao && cargo build --release --locked)
          (cd crates/skill-hub && cargo build --release --locked)
      - name: Run the supply chain
        run: |
          DAO=$PWD/crates/dao/target/release/dao
          HUB=$PWD/crates/skill-hub/target/release/skill-hub
          S=$RUNNER_TEMP/store; L=$RUNNER_TEMP/logs; mkdir -p "$L"
          jq -c '.sources[]' crates/dao/tools/intake_bench.json | while read -r src; do
            repo=$(jq -r .repo <<<"$src"); rev=$(jq -r .rev <<<"$src")
            out="$L/intake-${repo//\//_}.json"
            "$DAO" intake --store "$S" --git "https://github.com/$repo" --rev "$rev" --all > "$out"
            # a source that pins to another commit or stages nothing is a broken benchmark, not a result
            jq -e --arg rev "$rev" '.commit == $rev and ([.outcomes[] | select(.outcome == "staged")] | length) > 0' "$out" > /dev/null \
              || { echo "intake of $repo did not stage anything at $rev"; exit 1; }
          done
          "$DAO" scan --store "$S" --all > "$L/scan.json"
          "$DAO" normalize --store "$S" --all > "$L/normalize.json"
          "$DAO" relations --store "$S" > "$L/relations.json"
          "$HUB" index --root thirdparty="$S/objects" --out "$RUNNER_TEMP/reg.json" > "$L/index.json"
          "$DAO" eval gen --store "$S" > "$L/eval-gen.json"
          "$DAO" eval run --store "$S" --registry "$RUNNER_TEMP/reg.json" --searcher "$HUB" > "$L/eval-run.json"
          for d in $(ls "$S/objects" | grep -E '^[0-9a-f]{64}$'); do
            rc=0; "$DAO" admit --store "$S" --digest "$d" > /dev/null || rc=$?
            case $rc in
              0) "$DAO" promote --store "$S" --digest "$d" > /dev/null ;;
              1) ;;  # refused: a result, listed in the report
              *) echo "admit failed on $d (exit $rc)"; exit 1 ;;
            esac
          done
          mkdir -p "$RUNNER_TEMP/target"
          "$DAO" publish --store "$S" --target "$RUNNER_TEMP/target" > "$L/publish-dry.json" || echo "publish dry run reported conflicts (exit $?)"
          echo "store=$S" >> "$GITHUB_ENV"
      - name: Report
        run: |
          python3 crates/dao/tools/intake_bench_report.py "$store" "$RUNNER_TEMP/logs" results | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Card fidelity (evaluation A3)
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 crates/dao/tools/card_fidelity.py --selftest
          rc=0; python3 crates/dao/tools/card_fidelity.py "$store" > fidelity.txt || rc=$?
          # third-party names are printed: keep them out of markdown rendering
          { echo '```'; cat fidelity.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-bench
          path: |
            results/
            ${{ runner.temp }}/logs/
            ${{ runner.temp }}/store/scans/
            ${{ runner.temp }}/store/cards/
            ${{ runner.temp }}/store/admissions/
            ${{ runner.temp }}/store/evals/
            ${{ runner.temp }}/store/relations.json
