name: rerank-e2e
# The reference reranker server (Qwen3-Reranker-0.6B) and the real `skill-hub hook`, end to end,
# on a few made-up public skills: no private data and no secrets, so it runs on pull requests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/skill-hub/tools/rerank_server.py
      - crates/skill-hub/tools/rerank_bench.py
      - crates/skill-hub/tools/test_rerank_server.py
      - crates/skill-hub/tools/mps_probe.py
      - crates/skill-hub/src/hook.rs
      - crates/skill-hub/src/dense.rs
      - crates/skill-hub/src/main.rs
      - .github/workflows/rerank-e2e.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash  # -eo pipefail
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install transformers==5.5.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rerank-server-qwen3-e61197ed  # the pinned model revision
      - name: Build skill-hub
        working-directory: crates/skill-hub
        run: cargo build --release --locked
      - name: Server unit tests (no model)
        run: python -m unittest discover -s crates/skill-hub/tools -p 'test_rerank_*.py'
      - name: Fixture skills and registry
        run: |
          S="$RUNNER_TEMP/skills"
          mk() { mkdir -p "$S/$1"; printf -- '---\nname: %s\ndescription: %s\n---\n# %s\n' "$1" "$2" "$1" > "$S/$1/SKILL.md"; }
          mk rust-cli-scaffold "Scaffold a Rust command-line application with cargo and clap argument parsing."
          mk xiaohongshu-note "Prepare a Xiaohongshu (小红书) image-text note package from existing copy and images."
          mk sql-query-tuning "Diagnose and speed up slow SQL queries with indexes and EXPLAIN plans."
          crates/skill-hub/target/release/skill-hub index --root fixture="$S" --out "$RUNNER_TEMP/reg.json"
      - name: Start the reference server
        run: |
          python3 -I crates/skill-hub/tools/rerank_server.py --port 8121 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -m 5 -X POST http://127.0.0.1:8121/rerank -d '{"query":"x","texts":["y"]}' > /dev/null && break
            sleep 5
          done
          curl -sf -m 60 -X POST http://127.0.0.1:8121/rerank \
            -d '{"query":"Set up a new Rust CLI tool with clap","texts":["sql-query-tuning: slow SQL queries","rust-cli-scaffold: Rust command-line application with clap"]}' \
            | tee scores.json
          # probabilities, and the Rust skill above the SQL one
          jq -e 'length == 2 and all(.[]; .score >= 0 and .score <= 1) and (.[1].score > .[0].score)' scores.json
      - name: Hook picks and abstains through the reranker
        env:
          SKILL_HUB_REGISTRY: ${{ runner.temp }}/reg.json
          SKILL_HUB_RERANK: http://127.0.0.1:8121
          SKILL_HUB_RERANK_TIMEOUT_MS: "120000"  # CPU runner; the default 3000 suits a GPU
          SKILL_HUB_HOOK_LOG: ${{ runner.temp }}/hook.log
        run: |
          H=crates/skill-hub/target/release/skill-hub
          hook() { jq -cn --arg p "$1" '{prompt: $p, hook_event_name: "UserPromptSubmit"}' | "$H" hook > /dev/null; tail -1 "$SKILL_HUB_HOOK_LOG"; }
          hook "Set up a new Rust CLI tool with clap for argument parsing" | tee a.json
          jq -e '.via == "rerank" and .picked == ["rust-cli-scaffold"]' a.json
          hook "帮我把这些文案和图片整理成一篇小红书笔记" | tee b.json
          jq -e '.via == "rerank" and .picked == ["xiaohongshu-note"]' b.json
          # small talk that still pulls a candidate lexically must be answered with no skill
          hook "Thanks for the Rust help earlier, that is all for now" | tee c.json
          jq -e '.via == "rerank-none" and .picked == []' c.json
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
  mac-concurrency:
    # many agents submitting prompts at once: latency, share answered within the hook's 3 s timeout,
    # throughput and memory of the reference server on Apple Silicon, for the shipped fp32 model,
    # fp16, and the 4-bit MLX conversion (measurement, not a gate: fails only if a server is down)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install torch==2.6.0 transformers==5.5.4 sentence-transformers==5.4.1 mlx-lm==0.31.3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mac-rerank-qwen3-e61197ed-mlx4-5f324548
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/skill-hub/target
          key: cargo-mac-${{ hashFiles('crates/skill-hub/Cargo.lock') }}
      - name: Build skill-hub
        working-directory: crates/skill-hub
        run: cargo build --release --locked
      - name: No-model hook under concurrency (BM25 over 2,600 synthetic skills)
        run: |
          S="$RUNNER_TEMP/skills"
          python3 - "$S" <<'PY'
          import os, random, sys
          random.seed(7)
          words = ("rust python sql docker deploy test lint note image video audio pdf excel chart api auth cache "
                   "queue cli web mobile design copy seo email crm invoice report scrape translate summarize").split()
          for i in range(2600):
              d = os.path.join(sys.argv[1], f"skill-{i:04d}")
              os.makedirs(d)
              desc = " ".join(random.choice(words) for _ in range(40))
              open(os.path.join(d, "SKILL.md"), "w").write(f"---\nname: skill-{i:04d}\ndescription: {desc}\n---\n# skill-{i:04d}\n")
          PY
          H=crates/skill-hub/target/release/skill-hub
          "$H" index --root synthetic="$S" --out "$RUNNER_TEMP/reg2600.json"
          { echo "no-model hook (BM25), 2,600 skills:"; python3 -I crates/skill-hub/tools/rerank_bench.py hook "$H" "$RUNNER_TEMP/reg2600.json"; } | tee hook.txt
          { echo "## no-model hook under concurrency on macos-latest"; echo; sed 's/^/    /' hook.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure
        run: |
          {
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize | paste -sd' ' -
            python -c "import platform, torch, mlx.core as mx; print('machine', platform.machine(), 'mps', torch.backends.mps.is_available(), 'mlx', mx.default_device())"
          } | tee -a bench.txt
          bench() {  # $1 port, then server flags
            python3 -I crates/skill-hub/tools/rerank_server.py --port "$1" "${@:2}" > "srv-$1.log" 2>&1 &
            pid=$!
            for i in $(seq 1 120); do
              curl -sf -m 5 -X POST "http://127.0.0.1:$1/rerank" -d '{"query":"x","texts":["y"]}' > /dev/null && break
              sleep 5
            done
            if ! grep "rerank server on" "srv-$1.log" | tee -a bench.txt; then
              echo "server on $1 did not start:"; cat "srv-$1.log"; exit 1
            fi
            python3 -I crates/skill-hub/tools/rerank_bench.py "$1" "$pid" | tee -a bench.txt
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          bench 8121                                       # default on Apple Silicon: MLX, one request per pass
          bench 8122 --max-batch-rows 64                   # MLX, up to ~6 requests merged per pass
          bench 8123 --backend torch                       # torch float16 on the Apple GPU
          { echo "## rerank server under concurrency on macos-latest"; echo; sed 's/^/    /' bench.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Server logs
        if: failure()
        run: cat srv-*.log || true
  mps-fp32-probe:
    # D7 round 6: float32 on the Apple GPU scored 88/112 against 98 on CPU and in float16. Compare
    # the served scores for the same synthetic rows to locate the error (diagnostic, not a gate).
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install torch==2.6.0 transformers==5.5.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mac-probe-qwen3-e61197ed
      - name: Probe
        working-directory: crates/skill-hub/tools
        run: python3 mps_probe.py | tee probe.txt; { echo "## MPS float32 probe"; echo; sed 's/^/    /' probe.txt; } >> "$GITHUB_STEP_SUMMARY"
