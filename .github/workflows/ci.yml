name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dao-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dao-skill-state/requirements.txt
      - run: python -m unittest discover -s dao-skill-state/scripts -p 'test_*.py'
      - run: python dao-skill-state/scripts/check_skill.py dao-skill-state
      - run: python dao-skill-state/scripts/check_skill.py skill-hub
  skill-hub-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [skill-hub, dao]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
