name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin:
    # the Claude Code plugin and marketplace manifests (.claude-plugin/) must validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.285
      - run: claude plugin validate .
      - run: claude plugin validate dao-skill-state
  dao-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dao-skill-state/requirements.txt
      - run: python -m unittest discover -s dao-skill-state/scripts -p 'test_*.py'
      - run: python dao-skill-state/scripts/check_skill.py dao-skill-state
      - run: python dao-skill-state/scripts/check_skill.py skill-hub
  skill-hub-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [skill-hub, dao]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - name: Identify the Rust compiler
        id: rust
        run: echo "hash=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # Cache build inputs and outputs, never check results: every check below still runs.
      - name: Cache Rust builds
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            crates/${{ matrix.crate }}/target/debug
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-${{ matrix.crate }}-debug-${{ hashFiles(format('crates/{0}/Cargo.lock', matrix.crate)) }}-${{ hashFiles(format('crates/{0}/src/**', matrix.crate), format('crates/{0}/tests/**', matrix.crate), format('crates/{0}/Cargo.toml', matrix.crate)) }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.hash }}-${{ matrix.crate }}-debug-${{ hashFiles(format('crates/{0}/Cargo.lock', matrix.crate)) }}-
      - name: Record cache receipt
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
