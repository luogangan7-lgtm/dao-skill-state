name: selector-eval
# D7 experiment: which local model best picks one skill (or none) for `skill-hub hook`.
# Experiments run here, never on a developer machine. The candidate data holds private skill
# descriptions and prompts, so it is committed encrypted (data.json.enc, gzip) and decrypted with the
# SELECTOR_EVAL_KEY secret; logs, artifacts and the summary carry only aggregate numbers.
# The key lives only in the `selector-eval` environment, which only `main` may deploy to: a pull
# request (even one editing this file) cannot obtain it, so PRs run the rules check only.
# The `jev` model sends each case's prompt and candidate descriptions to the hosted Jev API
# (TypeSafe) with the JEV_API secret of the same environment; the owner approved this on 2026-10-13.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/skill-hub/tools/selector_eval/**
      - .github/workflows/selector-eval.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash  # -eo pipefail: a failing left side of a pipe fails the step
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s crates/skill-hub/tools/selector_eval -p 'test_*.py'
  preflight:
    # model jobs: manual dispatch on main only, and only when the key is available
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: selector-eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        env:
          KEY: ${{ secrets.SELECTOR_EVAL_KEY }}
        run: echo "has_key=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  cands:
    # rebuild every case's top-10 once, the way skill-hub ranks (BM25 + bge-m3 dense, RRF)
    needs: [rules, preflight]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.has_key == 'true'
    environment: selector-eval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ceiling: ${{ steps.c.outputs.ceiling }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install sentence-transformers==5.4.1 transformers==5.5.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cands-v2-${{ hashFiles('crates/skill-hub/tools/selector_eval/revisions.json') }}  # v2: + Qwen3-Embedding
      - name: Build skill-hub
        working-directory: crates/skill-hub
        run: cargo build --release --locked
      # the key is only ever in openssl's environment, never in a step that runs model code
      - name: Decrypt data
        env:
          KEY: ${{ secrets.SELECTOR_EVAL_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in crates/skill-hub/tools/selector_eval/data.json.enc -pass env:KEY | gunzip > "$RUNNER_TEMP/bundle.json"
      - id: c
        name: Candidates
        run: |
          trap 'rm -f "$RUNNER_TEMP/bundle.json"' EXIT
          python crates/skill-hub/tools/selector_eval/eval.py cands "$RUNNER_TEMP/bundle.json" \
            "$PWD/crates/skill-hub/target/release/skill-hub" "$RUNNER_TEMP/cands.json" | tee ceiling.txt
          echo "ceiling=$(tr '\n' ';' < ceiling.txt)" >> "$GITHUB_OUTPUT"
      - name: Encrypt candidates
        env:
          KEY: ${{ secrets.SELECTOR_EVAL_KEY }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/cands.json"' EXIT
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in "$RUNNER_TEMP/cands.json" -out cands.json.enc -pass env:KEY
      - uses: actions/upload-artifact@v4
        with:
          name: selector-cands
          path: cands.json.enc
          retention-days: 3
  eval:
    needs: [preflight, cands]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.has_key == 'true'
    environment: selector-eval
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # round 5: hosted Jev vs the shipped local selector, same candidates (what the hook sends)
        include:
          - {model: qwen3rr-skill, src: bgem3, k: 10}
          - {model: jev, src: bgem3, k: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install sentence-transformers==5.4.1 transformers==5.5.4
          case "${{ matrix.model }}" in laya-*) pip install laya==0.4.6 ;; esac
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-${{ hashFiles('crates/skill-hub/tools/selector_eval/revisions.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: selector-cands
      - name: Decrypt candidates
        env:
          KEY: ${{ secrets.SELECTOR_EVAL_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in cands.json.enc -out "$RUNNER_TEMP/cands.json" -pass env:KEY
      - name: Evaluate
        env:
          # the Jev key reaches the jev job only; it is sent to api.typesafe.ai and nowhere else
          JEV_API: ${{ matrix.model == 'jev' && secrets.JEV_API || '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/cands.json"' EXIT
          python crates/skill-hub/tools/selector_eval/eval.py run "$RUNNER_TEMP/cands.json" "${{ matrix.model }}" results \
            "${{ matrix.src }}" "${{ matrix.k }}"
      - uses: actions/upload-artifact@v4
        with:
          name: selector-eval-${{ matrix.model }}-${{ matrix.src }}-k${{ matrix.k }}
          path: results/
          retention-days: 14
  report:
    needs: [preflight, cands, eval]
    if: always() && needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true  # every model job may have failed; the summary says so
        with:
          pattern: selector-eval-*
          merge-multiple: true
          path: results
      - name: Summary
        run: |
          {
            echo "## skill-hub selector eval, round 5: hosted Jev vs local selector (tau tuned on dev per config, applied once to held-out)"
            echo
            echo "Recall of each retrieval list (gold skill within the first k): ${{ needs.cands.outputs.ceiling }}"
            echo
            python3 crates/skill-hub/tools/selector_eval/eval.py report results
          } >> "$GITHUB_STEP_SUMMARY"
