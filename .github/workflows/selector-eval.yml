name: selector-eval
# D7 / A4 experiment: which local model best picks one skill (or none) for `skill-hub hook`, and
# the threshold (tau) each needs. Experiments run here, never on a developer machine.
# Data is public (evaluation A4): requests in selector_eval/public_cases.json against a registry of
# the pinned third-party skills (crates/dao/tools/intake_bench.json), rebuilt in the cands job and
# never committed. The candidates artifact carries those skills' descriptions only for the eval
# jobs (1 day); the bundle with the full registry stays inside the cands job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/skill-hub/tools/selector_eval/**
      - crates/skill-hub/tools/rerank_server.py
      - .github/workflows/selector-eval.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash  # -eo pipefail: a failing left side of a pipe fails the step
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s crates/skill-hub/tools/selector_eval -p 'test_*.py'
  cands:
    # rebuild every case's top-10 once, the way skill-hub ranks (BM25 + bge-m3 dense, RRF)
    needs: [rules]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ceiling: ${{ steps.c.outputs.ceiling }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install sentence-transformers==5.4.1 transformers==5.5.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cands-v2-${{ hashFiles('crates/skill-hub/tools/selector_eval/revisions.json') }}  # v2: + Qwen3-Embedding
      - name: Build dao and skill-hub
        run: |
          (cd crates/dao && cargo build --release --locked)
          (cd crates/skill-hub && cargo build --release --locked)
      - name: Public bundle
        run: |
          crates/skill-hub/tools/selector_eval/public_registry.sh "$RUNNER_TEMP/store" "$RUNNER_TEMP/reg.json"
          python crates/skill-hub/tools/selector_eval/public_bench.py bundle "$RUNNER_TEMP/reg.json" \
            crates/skill-hub/tools/selector_eval/public_cases.json "$RUNNER_TEMP/bundle.json"
      - id: c
        name: Candidates
        run: |
          trap 'rm -f "$RUNNER_TEMP/bundle.json"' EXIT
          python crates/skill-hub/tools/selector_eval/eval.py cands "$RUNNER_TEMP/bundle.json" \
            "$PWD/crates/skill-hub/target/release/skill-hub" cands.json | tee ceiling.txt
          echo "ceiling=$(tr '\n' ';' < ceiling.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: selector-cands
          path: cands.json
          retention-days: 1
  eval:
    needs: [cands]
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # A4: the shipped scorer (CPU float32 and Apple MLX 4-bit) and the no-model hook, tau tuned on public dev
        include:
          - {model: lexical, src: bgem3, k: 10}
          - {model: srv-fp32, src: bgem3, k: 10}
          - {model: srv-mlx4, src: bgem3, k: 10, os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch on Linux; MPS torch + MLX on macOS)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pip install torch==2.6.0 mlx-lm==0.31.3
          else
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          fi
          pip install sentence-transformers==5.4.1 transformers==5.5.4
          case "${{ matrix.model }}" in laya-*) pip install laya==0.4.6 ;; esac
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-${{ runner.os }}-${{ hashFiles('crates/skill-hub/tools/selector_eval/revisions.json', 'crates/skill-hub/tools/rerank_server.py') }}
      - uses: actions/download-artifact@v4
        with:
          name: selector-cands
      - name: Evaluate
        env:
          # the Jev key reaches the jev job only; it is sent to api.typesafe.ai and nowhere else
          JEV_API: ${{ matrix.model == 'jev' && secrets.JEV_API || '' }}
          SELECTOR_TAG: ${{ runner.os == 'macOS' && '@mps' || '' }}
        run: |
          python crates/skill-hub/tools/selector_eval/eval.py run cands.json "${{ matrix.model }}" results \
            "${{ matrix.src }}" "${{ matrix.k }}"
      - uses: actions/upload-artifact@v4
        with:
          name: selector-eval-${{ matrix.model }}-${{ matrix.src }}-k${{ matrix.k }}-${{ runner.os }}
          path: results/
          retention-days: 14
  report:
    needs: [cands, eval]
    if: always() && needs.cands.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true  # every model job may have failed; the summary says so
        with:
          pattern: selector-eval-*
          merge-multiple: true
          path: results
      - name: Summary
        run: |
          {
            echo "## skill-hub selector eval, A4 on public data (requests generated from the pinned third-party skills; easier than real traffic) (tau tuned on dev per config, applied once to held-out)"
            echo
            echo "Recall of each retrieval list (gold skill within the first k): ${{ needs.cands.outputs.ceiling }}"
            echo
            python3 crates/skill-hub/tools/selector_eval/eval.py report results
          } >> "$GITHUB_STEP_SUMMARY"
