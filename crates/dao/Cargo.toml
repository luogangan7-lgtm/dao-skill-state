[package]
name = "dao"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DAO skill supply chain: intake (source pinning, quarantine), scanning, normalization"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
sha2 = "0.10.9"

[profile.release]
strip = true
lto = true
